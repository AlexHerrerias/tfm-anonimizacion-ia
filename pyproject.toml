[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm"
version = "2.0.0"
description = "TFM — Estrategias de anonimización y privacidad en el ciclo de vida del aprendizaje automático (UNED)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Alex Herrerias" }]
dependencies = [
    # Stack coherente con el entorno Colab que produjo los números de la
    # memoria. diffprivlib 0.6.6 exige numpy>=2.0 y scipy>=1.13, por lo que
    # los pines históricos numpy 1.26 / scipy 1.11 eran ininstalables.
    "numpy==2.0.2",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
    "matplotlib==3.10.0",
    "ucimlrepo==0.0.7",
    "diffprivlib==0.6.6",
    "adversarial-robustness-toolbox==1.20.1",
]

[project.scripts]
tfm = "tfm.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
